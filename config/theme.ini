elements.browse_layout.options.value_options.h_gallery = "Gallery with horizontal metadata layout"
elements.browse_layout.options.value_options.v_gallery = "Gallery with vertical metadata layout"
elements.browse_layout.options.element_group = "search_and_browse"

elements.fb_search_help.name = "fb_search_help"
elements.fb_search_help.type = "Checkbox"
elements.fb_search_help.options.label = "Don't collapse Faceted Browse help text"
