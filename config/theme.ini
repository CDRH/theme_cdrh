[info]
name = "CDRH Base Theme"
version = "0.1.0"
author = "Center for Digital Research in the Humanities"
description = "Omeka S starter theme for CDRH Projects"
theme_link = "https://github.com/cdrh/omeka_s_cdrh_theme"
author_link = "https://cdrh.unl.edu/"
omeka_version_constraint = "^4.1.0"

[config]
########
# Page Templates
########

page_templates.page-full-width = "Full Width (add containers manually)"

########
# Block Templates
########

block_templates.html.html-full-width = "HTML Block: Full Width"
block_templates.html.html-read-more = "HTML Block: 'Read More' Button"

########
# Resource page regions
########

resource_page_regions.items.main = "Main"
resource_page_regions.items.second = "Secondary"

resource_page_blocks.items.main[] = "values"


########
# Settings
########

element_groups.general = "General"
element_groups.fonts = "Fonts"
element_groups.buttons = "Buttons and Borders"
element_groups.header = "Header"
element_groups.navbar = "Navbar"
element_groups.navbar_1 = "Navbar colors - 1st level"
element_groups.navbar_2 = "Navbar colors - 2nd level"
element_groups.search_and_browse = "Search and Browse"
element_groups.page_not_found = "404 Page"
element_groups.footer = "Footer"
element_groups.footer_logos = "Footer Logos"

########
# General
########

elements.title_full.name = "title_full"
elements.title_full.type = "Text"
elements.title_full.options.label = "Full site title"
elements.title_full.options.info = "The full site name, including the subtitle. The short title, used for browser tabs and screen readers, is the Title provided in Site Admin settings."
elements.title_full.options.element_group = "general"

elements.header_title.name = "header_title"
elements.header_title.type = "Text"
elements.header_title.options.label = "Site title (header line 1)"
elements.header_title.options.info = "Site title as it should appear in the header."
elements.header_title.options.element_group = "general"

elements.header_subtitle.name = "header_subtitle"
elements.header_subtitle.type = "Text"
elements.header_subtitle.options.label = "Site subtitle (header line 2)"
elements.header_subtitle.options.info = "Subtitle as it should appear below the site title in the header."
elements.header_subtitle.options.element_group = "general"

elements.bg_color.name = "bg_color"
elements.bg_color.type = "Omeka\Form\Element\ColorPicker"
elements.bg_color.options.label = "Default background color"
elements.bg_color.options.info = "The default background color for the site."
elements.bg_color.attributes.value = "#FEFEFE"
elements.bg_color.options.element_group = "general"

elements.text_color.name = "text_color"
elements.text_color.type = "Omeka\Form\Element\ColorPicker"
elements.text_color.options.label = "Default text color"
elements.text_color.options.info = "The default color to be used for text. This color will be used for site text that otherwise doesn't have any styles applied in via SASS in the theme files, the CSS Editor, or the other settings on this page."
elements.text_color.attributes.value = "#000000"
elements.text_color.options.element_group = "general"

elements.link_color.name = "link_color"
elements.link_color.type = "Omeka\Form\Element\ColorPicker"
elements.link_color.options.label = "Link color"
elements.link_color.options.info = "The default color to be used for links."
elements.link_color.attributes.value = "#3E40C7"
elements.link_color.options.element_group = "general"

elements.link_hover_color.name = "link_hover_color"
elements.link_hover_color.type = "Omeka\Form\Element\ColorPicker"
elements.link_hover_color.options.label = "Link color (hover)"
elements.link_hover_color.options.info = "The default color to be used when hovering over links."
elements.link_hover_color.attributes.value = "#000480"
elements.link_hover_color.options.element_group = "general"

elements.visited_color.name = "visited_color"
elements.visited_color.type = "Omeka\Form\Element\ColorPicker"
elements.visited_color.options.label = "Visited link color"
elements.visited_color.options.info = "The default color to be used for visited links."
elements.visited_color.attributes.value = "#7A2EA4"
elements.visited_color.options.element_group = "general"

########
# Fonts
########

elements.font_size.name = "font_size"
elements.font_size.type = "Text"
elements.font_size.options.label = "Body font size"
elements.font_size.options.info = "Default font size for body text. If left empty, the site will use the theme's default font size (1rem)."
elements.font_size.attributes.value = ""
elements.font_size.options.element_group = "fonts"

elements.font_body.name = "font_body"
elements.font_body.type = "Radio"
elements.font_body.options.label = "Body font style"
elements.font_body.options.info = "Choose the font style to be used for the bulk of the site's text. If no custom fonts are provided above, the site will use the theme's default font stacks. IMPORTANT: fonts must first be imported—either through the theme files, or through the Stylesheets feature in the CSS Editor—or they won't work."
elements.font_body.options.value_options.sans-serif = "Sans-serif"
elements.font_body.options.value_options.serif = "Serif"
elements.font_body.attributes.value = "sans-serif"
elements.font_body.options.element_group = "fonts"

elements.font_sans.name = "font_sans"
elements.font_sans.type = "Text"
elements.font_sans.options.label = "Custom sans-serif font (optional)"
elements.font_sans.options.info = "Use this to add a new sans-serif font to be used site-wide. Multi-word fonts must be wrapped in quotation marks (e.g. (\"Helvetica Neue\"). It will be added to the beginning of the theme's default sans-serif font stack. IMPORTANT: fonts must first be imported—either through the theme files, or through the Stylesheets feature in the CSS Editor—or they won't work."
elements.font_sans.options.element_group = "fonts"

elements.font_serif.name = "font_serif"
elements.font_serif.type = "Text"
elements.font_serif.options.label = "Custom serif font (optional)"
elements.font_serif.options.info = "Use this to add a new serif font to be used site-wide.  Multi-word fonts must be wrapped in quotation marks (e.g. \"Times New Roman\"). It will be added to the beginning of the theme's default sans-serif font stack. IMPORTANT: fonts must be imported—either through the theme files, or through the Stylesheets feature in the CSS Editor—or they won't work."
elements.font_serif.options.element_group = "fonts"

elements.font_style_headings.name = "font_style_headings"
elements.font_style_headings.type = "Radio"
elements.font_style_headings.options.label = "Headings font style"
elements.font_style_headings.options.info = "Choose the font style to be used for the site's headings. If no custom sans-serif and/or serif fonts were included above, the Sans-serif and Serif options will fall back on the theme's default font stacks for the corresponding style. IMPORTANT: fonts must first be imported—either through the theme files, or through the Stylesheets feature in the CSS Editor—or they won't work."
elements.font_style_headings.options.value_options.sans-serif = "Sans-serif"
elements.font_style_headings.options.value_options.serif = "Serif"
elements.font_style_headings.attributes.value = "serif"
elements.font_style_headings.options.element_group = "fonts"

elements.font_headings.name = "font_headings"
elements.font_headings.type = "Text"
elements.font_headings.options.label = "Custom headings font (optional)"
elements.font_headings.options.info = "Use this to add a custom font for headings. If left empty, the headings will fall back on your font choices so far. Multi-word fonts must be wrapped in quotation marks (e.g. \"Times New Roman\"). It will be added to the beginning of the theme's default sans-serif font stack. IMPORTANT: fonts must be imported—either through the theme files, or through the Stylesheets feature in the CSS Editor—or they won't work."
elements.font_headings.attributes.value = ""
elements.font_headings.options.element_group = "fonts"

#######
# Buttons
######

elements.border_radius.name = "border_radius"
elements.border_radius.type = "Laminas\Form\Element\Select"
elements.border_radius.options.label = "Rounded corners"
elements.border_radius.options.info = "Choose whether corners of buttons and various other UI elements are rounded or not."
elements.border_radius.options.value_options.0 = "No rounded corners"
elements.border_radius.options.value_options.4 = "Small (4px)"
elements.border_radius.options.value_options.8 = "Large (8px)"
elements.border_radius.attributes.value = 4
elements.border_radius.options.element_group = "buttons"

elements.border_color.name = "border_color"
elements.border_color.type = "Omeka\Form\Element\ColorPicker"
elements.border_color.options.label = "Default border color"
elements.border_color.options.info = "The default color to be used for card borders, table borders, and horizontal rules. Light gray is recommended."
elements.border_color.attributes.value = "#CED4dA"
elements.border_color.options.element_group = "buttons"

elements.btn_primary_bg.name = "btn_primary_bg"
elements.btn_primary_bg.type = "Omeka\Form\Element\ColorPicker"
elements.btn_primary_bg.options.label = "Primary button color"
elements.btn_primary_bg.options.info = "Main background color for buttons. Must be contrast-compliant wth the text color below."
elements.btn_primary_bg.attributes.value = "#3E40C7"
elements.btn_primary_bg.options.element_group = "buttons"

elements.btn_primary.name = "btn_primary"
elements.btn_primary.type = "Omeka\Form\Element\ColorPicker"
elements.btn_primary.options.label = "Primary button text color"
elements.btn_primary.options.info = "Main text color for buttons. Must be contrast-compliant with the background color above."
elements.btn_primary.attributes.value = "#FFFFFF"
elements.btn_primary.options.element_group = "buttons"

elements.btn_primary_bg_hover.name = "btn_primary_bg_hover"
elements.btn_primary_bg_hover.type = "Omeka\Form\Element\ColorPicker"
elements.btn_primary_bg_hover.options.label = "Primary button color (hover)"
elements.btn_primary_bg_hover.options.info = "Main background color for buttons on hover. Must be contrast-compliant with the text color below."
elements.btn_primary_bg_hover.attributes.value = "#000480"
elements.btn_primary_bg_hover.options.element_group = "buttons"

elements.btn_hover_primary.name = "btn_hover_primary"
elements.btn_hover_primary.type = "Omeka\Form\Element\ColorPicker"
elements.btn_hover_primary.options.label = "Primary button text color (hover)"
elements.btn_hover_primary.options.info = "Main text color for buttons on hover. Must be contrast-compliant with the background color above."
elements.btn_hover_primary.attributes.value = "#FFFFFF"
elements.btn_hover_primary.options.element_group = "buttons"

elements.btn_secondary_bg.name = "btn_secondary_bg"
elements.btn_secondary_bg.type = "Omeka\Form\Element\ColorPicker"
elements.btn_secondary_bg.options.label = "Secondary button color"
elements.btn_secondary_bg.options.info = "Secondary background color for buttons. Must be contrast-compliant wth the text color below."
elements.btn_secondary_bg.attributes.value = "#55569E"
elements.btn_secondary_bg.options.element_group = "buttons"

elements.btn_secondary.name = "btn_secondary"
elements.btn_secondary.type = "Omeka\Form\Element\ColorPicker"
elements.btn_secondary.options.label = "Secondary button text color"
elements.btn_secondary.options.info = "Secondary text color for buttons. Must be contrast-compliant with the background color above."
elements.btn_secondary.attributes.value = "#FFFFFF"
elements.btn_secondary.options.element_group = "buttons"

elements.btn_secondary_bg_hover.name = "btn_secondary_bg_hover"
elements.btn_secondary_bg_hover.type = "Omeka\Form\Element\ColorPicker"
elements.btn_secondary_bg_hover.options.label = "Secondary button color (hover)"
elements.btn_secondary_bg_hover.options.info = "Secondary background color for buttons on hover. Must be contrast-compliant wth the text color below."
elements.btn_secondary_bg_hover.attributes.value = "#333475"
elements.btn_secondary_bg_hover.options.element_group = "buttons"

elements.btn_hover_secondary.name = "btn_hover_secondary"
elements.btn_hover_secondary.type = "Omeka\Form\Element\ColorPicker"
elements.btn_hover_secondary.options.label = "Secondary button text color (hover)"
elements.btn_hover_secondary.options.info = "Secondary text color for buttons on hover. Must be contrast-compliant with the background color above."
elements.btn_hover_secondary.attributes.value = "#FFFFFF"
elements.btn_hover_secondary.options.element_group = "buttons"

########
# Header
########

elements.center_header.name = "center_header"
elements.center_header.type = "Checkbox"
elements.center_header.options.label = "Center site title and main menu"
elements.center_header.options.info = "Check this box to center the site's header content (including the site title and main menu). IMPORTANT: Main Menu items will NOT be centered on mobile."
elements.center_header.options.element_group = "header"

elements.site_title_color.name = "site_title_color"
elements.site_title_color.type = "Omeka\Form\Element\ColorPicker"
elements.site_title_color.options.label = "Site title color"
elements.site_title_color.options.info = "The color of the site title in the header."
elements.site_title_color.attributes.value = "#000000"
elements.site_title_color.options.element_group = "header"

elements.header_bg.name = "header_bg"
elements.header_bg.type = "Omeka\Form\Element\ColorPicker"
elements.header_bg.options.label = "Header background color"
elements.header_bg.options.info = "Background color for the header. It can help to choose a background color even if you are using a banner, in case the image doesn't load."
elements.header_bg.attributes.value = "#333333"
elements.header_bg.options.element_group = "header"

elements.banner.name = "banner"
elements.banner.type = "Omeka\Form\Element\Asset"
elements.banner.options.label = "Banner"
elements.banner.options.info = "Header background image that will appear behind the site title."
elements.banner.options.element_group = "header"

########
# Navbar
########

elements.breakpoint.name = "breakpoint"
elements.breakpoint.attributes.id = "breakpoint"
elements.breakpoint.options.label = "Collapse menu at"
elements.breakpoint.type = "Laminas\Form\Element\Select"
elements.breakpoint.options.info = "Screen width (breakpoint) at which the navigation menu should collapse into a hamburger menu for mobile devices and narrow screens. Use Medium if there are lots of side-by-side links in the desktop menu."
elements.breakpoint.options.value_options.md = "Medium (768px wide)"
elements.breakpoint.options.value_options.lg = "Large (992px wide)"
elements.breakpoint.options.value_options.none = "Don't collapse menu"
elements.breakpoint.attributes.value = "md"
elements.breakpoint.options.element_group = "navbar"

elements.show_navbar_2.name = "show_navbar_2"
elements.show_navbar_2.id = "show_navbar_2"
elements.show_navbar_2.type = "Checkbox"
elements.show_navbar_2.options.label = "Show second level of main menu"
elements.show_navbar_2.options.info = "Check to show child pages in the main menu. Uncheck to show first-level pages only."
elements.show_navbar_2.attributes.value = true
elements.show_navbar_2.options.element_group = "navbar"

elements.navbar_1_height.name = "navbar_1_height"
elements.navbar_1_height.type = "Text"
elements.navbar_1_height.options.label = "Navbar height - 1st level"
elements.navbar_1_height.options.info = "Set the height of the first level of the main menu"
elements.navbar_1_height.attributes.value = "3rem"
elements.navbar_1_height.options.element_group = "navbar"

elements.navbar_2_height.name = "navbar_2_height"
elements.navbar_2_height.type = "Text"
elements.navbar_2_height.options.label = "Navbar height - 2nd level"
elements.navbar_2_height.options.info = "Set the height of the second level of the main menu"
elements.navbar_2_height.attributes.value = "2.25rem"
elements.navbar_2_height.options.element_group = "navbar"

