elements.fb_search_help.options.element_group = "search_and_browse"

elements.fb_layout.name = "fb_layout"
elements.fb_layout.type = "Radio"
elements.fb_layout.options.label = "Display Faceted Browse results as:"
elements.fb_layout.options.info = "These options allow you to choose a different layout for the Faceted Browse module's results."
elements.fb_layout.options.value_options.default = "Table (default)"
elements.fb_layout.options.value_options.h_gallery = "Gallery with horizontal metadata layout"
elements.fb_layout.options.value_options.v_gallery = "Gallery with vertical metadata layout"
elements.fb_layout.options.element_group = "search_and_browse"

elements.labels_to_hide.name = "labels_to_hide"
elements.labels_to_hide.type = "Laminas\Form\Element\Textarea"
elements.labels_to_hide.options.label = "Metadata labels to hide (gallery layouts only)"
elements.labels_to_hide.options.info = "Hide specific metadata labels from browse results by adding them here, each label on a new line. Labels are case-sensitive and must match the corresponding Column Name in the Faceted Browse configuration."
elements.labels_to_hide.attributes.value = "Title
Description"
elements.labels_to_hide.attributes.placeholder = "Title
Description
Date"
elements.labels_to_hide.attributes.rows = 5
elements.labels_to_hide.options.element_group = "search_and_browse"

elements.fb_hide_labels.name = "fb_hide_labels"
elements.fb_hide_labels.type = "Checkbox"
elements.fb_hide_labels.options.label = "Hide ALL metadata labels (gallery layouts only)"
elements.fb_hide_labels.options.info = "Check this box to hide all labels that would otherwise precede each metadata value (e.g. \"Date:\")."
elements.fb_hide_labels.options.element_group = "search_and_browse"

elements.fb_img_height.name = "fb_img_height"
elements.fb_img_height.type = "Number"
elements.fb_img_height.options.label = "Max thumbnail height (px)"
elements.fb_img_height.options.info = "Maximum height of faceted browse and browse thumbnails. Note that an image that is wider than it is tall will respect the maximum width set below. Leave this blank to use the theme default."
elements.fb_img_height.options.element_group = "search_and_browse"

elements.fb_img_width.name = "fb_img_width"
elements.fb_img_width.type = "Number"
elements.fb_img_width.options.label = "Max thumbnail width (px)"
elements.fb_img_width.options.info = "Maximum width of faceted browse and browse thumbnails. Note that an image that is taller than it is wide will respect the maximum height set above. Leave this blank to use the theme default."
elements.fb_img_width.options.element_group = "search_and_browse"


