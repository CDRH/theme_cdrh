[info]
name = "CDRH Base Theme"
version = "0.1.0"
author = "Center for Digital Research in the Humanities"
description = "Omeka S starter theme for CDRH Projects"
theme_link = "https://github.com/cdrh/omeka_s_cdrh_theme"
author_link = "https://cdrh.unl.edu/"
omeka_version_constraint = "^4.1.0"

[config]

element_groups.header = "Header"
element_groups.navbar = "Navbar"
element_groups.search_and_browse = "Search and Browse"
element_groups.footer = "Footer"
element_groups.page_not_found = "404 Page"
element_groups.artwork_for_templates = "Artwork for page templates"

########
# Header
########

elements.site_title_long.name = "site_title_long"
elements.site_title_long.type = "Text"
elements.site_title_long.options.label = "Site Title (long)"
elements.site_title_long.options.info = "The full site name, including the subtitle. The short title for the site is the Title provided in Site Admin settings."
elements.site_title_long.options.element_group = "header"

elements.site_subtitle.name = "site_subtitle"
elements.site_subtitle.type = "Text"
elements.site_subtitle.options.label = "Site Subtitle"
elements.site_subtitle.options.info = "Subtitle that appears below the site title in the header."
elements.site_subtitle.options.element_group = "header"

elements.banner.name = "banner"
elements.banner.type = "Omeka\Form\Element\Asset"
elements.banner.options.label = "Banner"
elements.banner.options.info = "A large image at the top of the page"
elements.banner.options.element_group = "header"

elements.banner_bg.name = "banner_bg"
elements.banner_bg.attributes.id = "banner_bg"
elements.banner_bg.type = "Checkbox"
elements.banner_bg.options.label = "Make Banner a Background Image"
elements.banner_bg.options.label = "Check this box to place the banner image behind the site title instead of below it."
elements.banner_bg.attributes.value = 0
elements.banner_bg.options.element_group = "header"

########
# Navbar
########

elements.nav_depth.name = "nav_depth"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Top Navigation Depth"
elements.nav_depth.options.info = "Maximum number of levels to show in the site's top navigation bar. Set to 0 to show all levels."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 0
elements.nav_depth.options.element_group = "navbar"

elements.collapse_menu.name = "collapse_menu"
elements.collapse_menu.attributes.id = "collapse_menu"
elements.collapse_menu.options.label = "Collapse menu at:"
elements.collapse_menu.options.info = "Screen width (breakpoint) at which the navigation menu should collapse into a hamburger menu for mobile devices and narrow screens. Use Medium if there are lots of side-by-side links in the desktop menu."
elements.collapse_menu.options.value_options.sm = "Small (768px wide - default)"
elements.collapse_menu.options.value_options.md = "Medium (992px wide)"
elements.collapse_menu.options.value_options.none = "Don't collapse menu"
elements.collapse_menu.attributes = "sm"
elements.collapse_menu.options.element_group = "navbar"

########
# Search and Browse
########

elements.browse_body_truncation.name = "browse_body_truncation"
elements.browse_body_truncation.type = "Laminas\Form\Element\Select"
elements.browse_body_truncation.options.label = "Truncate Body Property"
elements.browse_body_truncation.options.info = "How to handle long values for the body property of each resource on the browse page."
elements.browse_body_truncation.options.value_options.full = "Show full value"
elements.browse_body_truncation.options.value_options.fade = "Show 4 lines and fade out"
elements.browse_body_truncation.options.value_options.ellipsis = "Show 4 lines and clip with an ellipsis"
elements.browse_body_truncation.options.element_group = "search_and_browse"

########
# Footer
########

elements.content_warning.name = "content_warning"
elements.content_warning.attributes.id = "content_warning"
elements.content_warning.type = "Omeka\Form\Element\HtmlTextarea"
elements.content_warning.options.label = "Footer - Content Warning"
elements.content_warning.options.info = "HTML for Content Warning that appears in the Footer"
elements.content_warning.attributes.value = "Please note: some of the materials on this site contains sensitive and potentially disturbing content."
elements.content_warning.options.element_group = "footer"


elements.footer.name = "footer_text"
elements.footer.attributes.id = "footer_text"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer HTML"
elements.footer.options.info = "HTML content to appear in the footer after the logos"
elements.footer.attributes.value = ""
elements.footer.options.element_group = "footer"

