[info]
name = "CDRH Base Theme"
version = "0.1.0"
author = "Center for Digital Research in the Humanities"
description = "Omeka S starter theme for CDRH Projects"
theme_link = "https://github.com/cdrh/omeka_s_cdrh_theme"
author_link = "https://cdrh.unl.edu/"
omeka_version_constraint = "^4.1.0"

[config]
########
# Page Templates
########

page_templates.page-full-width = "Full Width (add containers manually)"

########
# Block Templates
########

block_templates.html.html-full-width = "HTML Block: Full Width"
block_templates.html.html-read-more = "HTML Block: 'Read More' Button"

########
# Resource page regions
########

resource_page_regions.items.main = "Main"
resource_page_regions.items.second = "Secondary"

resource_page_blocks.items.main[] = "values"


########
# Settings
########

element_groups.general = "General"
element_groups.header = "Header"
element_groups.navbar = "Main Menu"
element_groups.search_and_browse = "Search and Browse"
element_groups.page_not_found = "404 Page"
element_groups.footer = "Footer"

########
# General
########

elements.site_title_long.name = "site_title_long"
elements.site_title_long.type = "Text"
elements.site_title_long.options.label = "Site Title (long)"
elements.site_title_long.options.info = "The full site name, including the subtitle. The short title for the site is the Title provided in Site Admin settings."
elements.site_title_long.options.element_group = "general"

elements.site_subtitle.name = "site_subtitle"
elements.site_subtitle.type = "Text"
elements.site_subtitle.options.label = "Site Subtitle"
elements.site_subtitle.options.info = "Subtitle that appears below the site title in the header."
elements.site_subtitle.options.element_group = "general"

elements.text_color.name = "text_color"
elements.text_color.type = "Omeka\Form\Element\ColorPicker"
elements.text_color.options.label = "Default Text Color"
elements.text_color.options.info = "The default color to be used for text. This color will be used for site text that otherwise doesn't have any styles applied in via SASS in the theme files, the CSS Editor, or the other settings on this page."
elements.text_color.attributes.value = "#000000"
elements.text_color.options.element_group = "general"

elements.link_color.name = "link_color"
elements.link_color.type = "Omeka\Form\Element\ColorPicker"
elements.link_color.options.label = "Link Color"
elements.link_color.options.info = "The default color to be used for links."
elements.link_color.attributes.value = "#3E40C7"
elements.link_color.options.element_group = "general"

elements.link_hover_color.name = "link_hover_color"
elements.link_hover_color.type = "Omeka\Form\Element\ColorPicker"
elements.link_hover_color.options.label = "Link Hover Color"
elements.link_hover_color.options.info = "The default color to be used when hovering over links."
elements.link_hover_color.attributes.value = "#000480"
elements.link_hover_color.options.element_group = "general"

elements.visited_color.name = "visited_color"
elements.visited_color.type = "Omeka\Form\Element\ColorPicker"
elements.visited_color.options.label = "Visited Link Color"
elements.visited_color.options.info = "The default color to be used for visited links."
elements.visited_color.attributes.value = "#7A2EA4"
elements.visited_color.options.element_group = "general"

elements.border_radius.name = "border_radius"
elements.border_radius.type = "Laminas\Form\Element\Select"
elements.border_radius.options.label = "Rounded Corners"
elements.border_radius.options.info = "Choose whether corners of buttons and some UI elements are rounded or not."
elements.border_radius.options.value_options.0 = "No rounded corners"
elements.border_radius.options.value_options.4 = "Small (4px)"
elements.border_radius.options.value_options.8 = "Large (8px)"
elements.border_radius.attributes.value = 4
elements.border_radius.options.element_group = "general"


########
# Header
########

elements.banner.name = "banner"
elements.banner.type = "Omeka\Form\Element\Asset"
elements.banner.options.label = "Banner"
elements.banner.options.info = "Header background image that will appear behind the site title."
elements.banner.options.element_group = "header"

elements.site_title_color.name = "site_title_color"
elements.site_title_color.type = "Omeka\Form\Element\ColorPicker"
elements.site_title_color.options.label = "Site Title Color"
elements.site_title_color.options.info = "The color of the site title in the header."
elements.site_title_color.attributes.value = "#000000"
elements.site_title_color.options.element_group = "header"

elements.center_header.name = "center_header"
elements.center_header.type = "Checkbox"
elements.center_header.options.label = "Center site title and main menu"
elements.center_header.options.info = "Check this box to center the site's header content (including the site title and main menu). IMPORTANT: Main Menu items will NOT be centered on mobile."
elements.center_header.options.element_group = "header"

########
# Main Menu
########

elements.collapse_menu.name = "collapse_menu"
elements.collapse_menu.attributes.id = "collapse_menu"
elements.collapse_menu.options.label = "Collapse menu at"
elements.collapse_menu.type = "Laminas\Form\Element\Select"
elements.collapse_menu.options.info = "Screen width (breakpoint) at which the navigation menu should collapse into a hamburger menu for mobile devices and narrow screens. Use Medium if there are lots of side-by-side links in the desktop menu."
elements.collapse_menu.options.value_options.md = "Medium (768px wide)"
elements.collapse_menu.options.value_options.lg = "Large (992px wide)"
elements.collapse_menu.options.value_options.none = "Don't collapse menu"
elements.collapse_menu.attributes.value = "md"
elements.collapse_menu.options.element_group = "navbar"

elements.show_secondary_menu.name = "show_secondary_menu"
elements.show_secondary_menu.id = "show_secondary_menu"
elements.show_secondary_menu.type = "Checkbox"
elements.show_secondary_menu.options.label = "Show second level of main menu"
elements.show_secondary_menu.options.info = "Check to show child pages in the main menu. Uncheck to show first-level pages only."
elements.show_secondary_menu.attributes.value = true
elements.show_secondary_menu.options.element_group = "navbar"

elements.navbar_height.name = "navbar_height"
elements.navbar_height.type = "Text"
elements.navbar_height.options.label = "Level 1 Menu Height"
elements.navbar_height.options.info = "Set the height of the first level of the main menu"
elements.navbar_height.attributes.value = "3rem"
elements.navbar_height.options.element_group = "navbar"

elements.navbar_secondary_height.name = "navbar_secondary_height"
elements.navbar_secondary_height.type = "Text"
elements.navbar_secondary_height.options.label = "Level 2 Menu Height"
elements.navbar_secondary_height.options.info = "Set the height of the second level of the main menu"
elements.navbar_secondary_height.attributes.value = "2.25rem"
elements.navbar_secondary_height.options.element_group = "navbar"

elements.navbar_transparent.name = "navbar_transparent"
elements.navbar_transparent.type = "Checkbox"
elements.navbar_transparent.options.label = "Transparent menu background"
elements.navbar_transparent.options.info = "Check this box to override all settings below and force the main menu to have a transparent background (i.e. the header background will extend behind the menu.)"
elements.navbar_transparent.options.element_group = "navbar"

