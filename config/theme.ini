########

elements.navbar_1_transparent.name = "navbar_1_transparent"
elements.navbar_1_transparent.type = "Checkbox"
elements.navbar_1_transparent.options.label = "Transparent menu background"
elements.navbar_1_transparent.options.info = "Check this box to override all settings below and force the main menu to have a transparent background (i.e. the header background will extend behind the menu.)"
