elements.navbar_1_hover_bg.options.element_group = "navbar_1"

elements.navbar_1_active_color.name = "navbar_1_active_color"
elements.navbar_1_active_color.type = "Omeka\Form\Element\ColorPicker"
elements.navbar_1_active_color.options.label = "Current page link color"
elements.navbar_1_active_color.options.info = "Link text color for the currently active page in the first level of the menu."
