elements.browse_body_truncation.options.value_options.fade = "Show 4 lines and fade out"
elements.browse_body_truncation.options.value_options.ellipsis = "Show 4 lines and clip with an ellipsis"
elements.browse_body_truncation.options.element_group = "search_and_browse"

elements.browse_layout.name = "browse_layout"
elements.browse_layout.type = "Radio"
elements.browse_layout.options.label = "Display browse results as:"
elements.browse_layout.options.info = "These options allow you to choose a different layout for Omeka S' native browse and browse blocks."
